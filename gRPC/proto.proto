syntax = "proto3";
option go_package = "handin4/grpc/proto";


message bidMSG {
    int32 amount = 1;
}
message resultMSG {
    int32 amount = 1;
    bool auctionOver = 2;
}
message IdentifierMSG {
    int32 id = 1;
}
message emptyMSG {}



service Auction {
    rpc bid (bidMSG) returns (emptyMSG);
    rpc Reply (emptyMSG) returns (resultMSG);
    rpc election(IdentifierMSG) returns (emptyMSG);
    rpc setnewLeader(IdentifierMSG) returns (emptyMSG);
    rpc requestLeader(emptyMSG) returns (emptyMSG);
    rpc ping(emptyMSG) returns (emptyMSG);
    rpc update(bidMSG) returns (bidMSG);
}
